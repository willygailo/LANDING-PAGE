<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Ordinary Ideas Learn to Play</title>
<meta name="description" content="We design digital spaces that feel alive — thoughtful, whimsical and totally bold. Step inside an interactive 3D experience.">
<meta name="theme-color" content="#12122a">
<link rel="canonical" href="https://yourdomain.com/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Where Ordinary Ideas Learn to Play">
<meta property="og:description" content="We design digital spaces that feel alive — thoughtful, whimsical and totally bold.">
<meta property="og:url" content="https://yourdomain.com/">
<meta property="og:site_name" content="Creative Studio">
<meta property="og:locale" content="en_US">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Where Ordinary Ideas Learn to Play">
<meta name="twitter:description" content="We design digital spaces that feel alive — thoughtful, whimsical and totally bold.">

<!-- JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Creative Studio",
  "url": "https://yourdomain.com/",
  "description": "We design digital spaces that feel alive — thoughtful, whimsical and totally bold."
}
</script>

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="canvas-container" role="img" aria-label="Interactive 3D village scene with houses, trees, a cyclist, and floating fireflies at dusk"></div>
<div class="vignette"></div>

<!-- Top Navigation -->
<header>
<nav class="top-nav" aria-label="Main navigation">
  <div class="nav-glass" role="menubar">
    <button class="nav-pill active" role="menuitem" aria-current="page">Home</button>
    <button class="nav-pill" role="menuitem">Stories</button>
    <button class="nav-pill" role="menuitem">Builds</button>
    <button class="nav-pill" role="menuitem">About</button>
    <button class="nav-pill" role="menuitem">Contact</button>
  </div>
</nav>
</header>

<!-- Left Node Navigation -->
<nav class="node-nav" aria-label="Section navigation">
  <div class="node-orbit">
    <div class="node-line node-line-1"></div>
    <div class="node-line node-line-2"></div>
    <div class="node-line node-line-3"></div>
    <div class="node-line node-line-4"></div>
    <button class="node-dot node-home active" aria-label="Home section" aria-current="true">
      <span>Home</span>
    </button>
    <button class="node-dot node-stories" aria-label="Stories section">
      <span>Stories</span>
    </button>
    <button class="node-dot node-builds" aria-label="Builds section">
      <span>Builds</span>
    </button>
    <button class="node-dot node-contact" aria-label="Contact section">
      <span>Contact</span>
    </button>
    <div class="node-center" aria-hidden="true"></div>
  </div>
</nav>

<!-- Hanging Lightbulb -->
<button class="lightbulb" aria-label="Toggle scene lighting" type="button">
  <div class="bulb-wire" aria-hidden="true"></div>
  <div class="bulb-base" aria-hidden="true"></div>
  <div class="bulb-glass" aria-hidden="true">
    <div class="bulb-filament"></div>
    <div class="bulb-glow"></div>
  </div>
</button>

<!-- Hero Card -->
<main>
<section class="hero-card" aria-labelledby="hero-heading">
  <h1 id="hero-heading" class="hero-title">Where Ordinary<br>Ideas Learn to Play</h1>
  <p class="hero-subtitle">We design digital spaces that feel alive —<br>thoughtful, whimsical and totally bold.</p>
  <button class="cta-btn">
    Step Inside
    <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </button>
</section>
</main>

<noscript>
  <p style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-family:system-ui;text-align:center;z-index:999;">
    This experience requires JavaScript. Please enable it to explore the 3D scene.
  </p>
</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
